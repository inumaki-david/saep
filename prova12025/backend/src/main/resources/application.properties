spring.application.name=backend

# informações do banco de dados [Entrega 3]
spring.jpa.database= postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/saep_db2
spring.datasource.username=postgres
spring.datasource.password=postgres

# jpa - automacao da criacao das tabelas do bd 
spring.jpa.hibernate.ddl-auto=update
# mostra o sql no terminal
spring.jpa.show-sql=true
# utilização de termos especifícos do PostgreSQL para otimizar consultas
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect