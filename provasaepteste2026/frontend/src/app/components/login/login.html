<main class="login-page">
	<section class="login-panel">
		<p class="eyebrow">SAEP | OFICINA MECÂNICA</p>
		<h1>Agenda de serviço<br /><em>sem conflito.</em></h1>
		<p class="intro">Controle clientes, boxes e o ritmo da sua oficina em um só lugar.</p>
		<form (ngSubmit)="entrar()" #form="ngForm">
			<label for="email">E-mail</label>
			<input id="email" name="email" type="email" [(ngModel)]="email" required placeholder="admin@oficina.com" />
			<label for="senha">Senha</label>
			<input id="senha" name="senha" type="password" [(ngModel)]="senha" required placeholder="Digite sua senha" />
			<p class="error" *ngIf="erro || erroExterno">{{ erro || erroExterno }}</p>
			<button type="submit" [disabled]="form.invalid || carregando">{{ carregando ? 'Conectando...' : 'Acessar painel' }} <span>→</span></button>
		</form>
		<small>Acesso administrativo</small>
	</section>
	<aside class="login-aside"><strong>Seu próximo serviço<br />começa aqui.</strong><p>Uma visão clara da operação para cada carro que entra pela sua porta.</p></aside>
</main>
